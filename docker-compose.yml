services:
  # MinIO S3 Compatible Storage
  minio:
    image: minio/minio:latest
    container_name: sbm_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - sbm_network

  # MinIO Client for bucket creation
  createbuckets:
    image: minio/mc:latest
    container_name: sbm_createbuckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c " sleep 10; /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin123; /usr/bin/mc mb myminio/sbm-complaints --ignore-existing; /usr/bin/mc policy set public myminio/sbm-complaints; exit 0; "
    networks:
      - sbm_network

  # Backend FastAPI Application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sbm_backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/__pycache__
    networks:
      - sbm_network
    restart: unless-stopped

volumes:
  minio_data:
    driver: local

networks:
  sbm_network:
    driver: bridge
name: Deploy Backend (feat-assets)

on:
  push:
    branches:
      - feat-assets
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "=========================================="
            echo "🚀 Starting Deployment for feat-assets..."
            echo "=========================================="

            PROJECT_DIR="${{ secrets.SERVER_PROJECT_PATH }}"
            if [ -z "$PROJECT_DIR" ]; then
              if [ -d "$HOME/SBMG-backend-v2" ]; then
                PROJECT_DIR="$HOME/SBMG-backend-v2"
              elif [ -d "/root/SBMG-backend-v2" ]; then
                PROJECT_DIR="/root/SBMG-backend-v2"
              else
                PROJECT_DIR="SBMG-backend-v2"
              fi
            fi

            echo "📂 Target Directory: $PROJECT_DIR"
            cd "$PROJECT_DIR"

            echo "📥 Fetching and pulling latest code..."
            PREV_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "")
            git fetch origin feat-assets
            git checkout feat-assets
            git pull origin feat-assets
            NEW_COMMIT=$(git rev-parse HEAD)

            # Check changed files between deployments
            if [ -n "$PREV_COMMIT" ] && [ "$PREV_COMMIT" != "$NEW_COMMIT" ]; then
              CHANGED_FILES=$(git diff --name-only "$PREV_COMMIT" "$NEW_COMMIT" 2>/dev/null || true)
            else
              CHANGED_FILES=""
            fi

            echo "📄 Changed files since last commit:"
            echo "${CHANGED_FILES:-"(no file diff detected / fresh branch)"}"

            NEED_BUILD=false
            NEED_MIGRATION=false

            if echo "$CHANGED_FILES" | grep -Eq "(Dockerfile|requirements|pyproject\.toml|poetry\.lock|docker-compose\.ya?ml)"; then
              NEED_BUILD=true
            fi

            if echo "$CHANGED_FILES" | grep -Eq "(alembic|backend/models)"; then
              NEED_MIGRATION=true
            fi

            if [ "$NEED_BUILD" = true ]; then
              echo "🔨 Dependency or Docker files changed. Rebuilding and restarting backend container..."
              docker compose up -d --build backend
              sleep 5
            elif [ "$NEED_MIGRATION" = true ]; then
              echo "📦 Migrations/Models changed. Restarting container (entrypoint.sh will auto-run alembic upgrade head)..."
              docker compose restart backend
              sleep 5
            else
              echo "⚡ Only app code changed. Uvicorn hot-reloads mounted volume automatically (no container restart needed)."
            fi

            echo "🔍 Checking backend health..."
            if curl -sf http://localhost:8000/health; then
              echo ""
              echo "=========================================="
              echo "✅ Deployment completed successfully!"
              echo "=========================================="
            else
              echo ""
              echo "❌ Health check failed. Recent container logs:"
              docker compose logs --tail=50 backend
              exit 1
            fi

name: Deploy Backend (feat-assets)

on:
  push:
    branches:
      - feat-assets
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "=========================================="
            echo "🚀 Starting Deployment for feat-assets..."
            echo "=========================================="

            PROJECT_DIR="${{ secrets.SERVER_PROJECT_PATH }}"
            if [ -z "$PROJECT_DIR" ]; then
              if [ -d "$HOME/SBMG-backend-v2" ]; then
                PROJECT_DIR="$HOME/SBMG-backend-v2"
              elif [ -d "/root/SBMG-backend-v2" ]; then
                PROJECT_DIR="/root/SBMG-backend-v2"
              else
                PROJECT_DIR="SBMG-backend-v2"
              fi
            fi

            echo "📂 Target Directory: $PROJECT_DIR"
            cd "$PROJECT_DIR"

            echo "📥 Fetching latest code..."
            git fetch origin feat-assets
            git checkout feat-assets
            git pull origin feat-assets

            echo "🐳 Rebuilding and restarting containers..."
            docker compose up -d --build backend

            echo "⏳ Waiting for backend service to become healthy..."
            sleep 10

            echo "🔍 Checking backend health..."
            if curl -f http://localhost:8000/health; then
              echo ""
              echo "=========================================="
              echo "✅ Deployment completed successfully!"
              echo "=========================================="
            else
              echo ""
              echo "❌ Health check failed. Recent container logs:"
              docker compose logs --tail=50 backend
              exit 1
            fi
